<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 데일리 운동 루틴 추천 프로그램</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .exercise-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .exercise-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- 헤더 영역 -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-semibold tracking-wide uppercase mb-3 border border-indigo-500/30">
        <span>C++ to Web Vibe Coding</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
        스마트 데일리 운동 루틴 추천
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        분할 방식과 요일을 선택하면 맞춤 운동 루틴과 세트 가이드를 제공합니다.
      </p>
    </header>

    <!-- 컨트롤 패널 (1주차 C++ 입력 로직 대응) -->
    <section class="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 mb-6 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <!-- 1. 분할 방식 선택 (splitOption: 1 or 2) -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
            1. 운동 분할 방식 선택
          </label>
          <div class="grid grid-cols-2 gap-2.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-700/70">
            <button id="btn-split-1" onclick="selectSplit(1)"
              class="py-2.5 px-4 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-md">
              4분할 루틴
            </button>
            <button id="btn-split-2" onclick="selectSplit(2)"
              class="py-2.5 px-4 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">
              3분할 (PPL)
            </button>
          </div>
        </div>

        <!-- 뷰 전환 및 오늘 요일 자동 선택 -->
        <div class="flex flex-col justify-between">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
            빠른 기능
          </label>
          <div class="flex gap-2.5">
            <button onclick="selectToday()"
              class="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 text-sm font-semibold transition-all flex items-center justify-center gap-1.5">
              <span>📅 오늘 요일 자동 선택</span>
            </button>
            <button id="btn-toggle-weekly" onclick="toggleWeeklyView()"
              class="py-2.5 px-4 rounded-xl bg-slate-700/70 hover:bg-slate-700 text-slate-200 border border-slate-600 text-sm font-semibold transition-all">
              주간 전체표
            </button>
          </div>
        </div>
      </div>

      <!-- 2. 요일 선택 (dayOfWeek: 1~6, 0) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
          2. 요일 선택 (C++ 기준: 월=1 ~ 토=6, 일=0)
        </label>
        <div id="day-buttons" class="grid grid-cols-7 gap-1.5 sm:gap-2.5">
          <!-- JS로 렌더링 -->
        </div>
      </div>
    </section>

    <!-- 결과 출력 영역 (일일 루틴 상세 뷰) -->
    <main id="daily-view" class="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 mb-6 border-b border-slate-700/80">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span id="badge-split" class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              4분할
            </span>
