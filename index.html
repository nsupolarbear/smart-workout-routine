<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 데일리 운동 루틴 추천 프로그램</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .exercise-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .exercise-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- 헤더 영역 -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-semibold tracking-wide uppercase mb-3 border border-indigo-500/30">
        <span>C++ to Web Vibe Coding</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
        스마트 데일리 운동 루틴 추천
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        분할 방식과 요일을 선택하면 맞춤 운동 루틴과 세트 가이드를 제공합니다.
      </p>
    </header>

    <!-- 컨트롤 패널 -->
    <section class="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 mb-6 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <!-- 1. 분할 방식 선택 -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
            1. 운동 분할 방식 선택
          </label>
          <div class="grid grid-cols-2 gap-2.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-700/70">
            <button id="btn-split-1" type="button"
              class="py-2.5 px-4 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-md">
              4분할 루틴
            </button>
            <button id="btn-split-2" type="button"
              class="py-2.5 px-4 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">
              3분할 (PPL)
            </button>
          </div>
        </div>

        <!-- 빠른 기능 -->
        <div class="flex flex-col justify-between">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
            빠른 기능
          </label>
          <div class="flex gap-2.5">
            <button id="btn-today" type="button"
              class="flex-1 py-2.5 px-4 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 text-sm font-semibold transition-all flex items-center justify-center gap-1.5">
              <span>📅 오늘 요일 자동 선택</span>
            </button>
            <button id="btn-toggle-weekly" type="button"
              class="py-2.5 px-4 rounded-xl bg-slate-700/70 hover:bg-slate-700 text-slate-200 border border-slate-600 text-sm font-semibold transition-all">
              주간 전체표
            </button>
          </div>
        </div>
      </div>

      <!-- 2. 요일 선택 -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">
          2. 요일 선택 (C++ 기준: 월=1 ~ 토=6, 일=0)
        </label>
        <div id="day-buttons" class="grid grid-cols-7 gap-1.5 sm:gap-2.5"></div>
      </div>
    </section>

    <!-- 결과 출력 영역 (일일 루틴 상세 뷰) -->
    <main id="daily-view" class="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 mb-6 border-b border-slate-700/80">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span id="badge-split" class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              4분할
            </span>
            <span id="badge-day" class="text-sm font-medium text-slate-400">월요일</span>
          </div>
          <h2 id="routine-title" class="text-2xl font-extrabold text-white">
            가슴 & 삼두
          </h2>
        </div>

            <span id="progress-text" class="font-bold text-emerald-400">0%</span>
          </div>
          <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="mb-5 px-4 py-3 rounded-xl bg-slate-950/70 border border-slate-800 font-mono text-xs sm:text-sm text-slate-300">
        <span class="text-indigo-400 font-bold">[C++ 로직 출력]</span>
        <span id="raw-cpp-output" class="ml-1"></span>
      </div>

      <!-- 운동 종목 카드 리스트 -->
      <div id="exercise-list" class="space-y-3"></div>
    </main>

        </table>
      </div>
    </section>
  </div>

    function selectSplit(splitOption) {
      currentSplit = splitOption;
      completedSet.clear();
      updateUI();

      currentDay = dayOfWeek;
      completedSet.clear();
      isWeeklyOpen = false;

        completedSet.add(idx);
      }
      renderExercises();
    }

    function toggleWeeklyView() {
      isWeeklyOpen = !isWeeklyOpen;
      updateUI();
    }

    function updateUI() {
      const btn1 = document.getElementById("btn-split-1");
      const btn2 = document.getElementById("btn-split-2");
      if (currentSplit === 1) {
        btn1.className = "py-2.5 px-4 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-md";
        btn2.className = "py-2.5 px-4 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white";
      } else {
        btn2.className = "py-2.5 px-4 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-md";
        btn1.className = "py-2.5 px-4 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white";
      }

      const dayContainer = document.getElementById("day-buttons");
      dayContainer.innerHTML = DAY_ORDER.map(d => {
        const isActive = d.id === currentDay;
        const isSunday = d.id === 0;
        let btnClass = "py-2.5 rounded-xl text-sm font-bold transition-all border ";
        if (isActive) {
          btnClass += "bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-500/20 scale-[1.03]";
        } else if (isSunday) {
          btnClass += "bg-slate-900/70 border-slate-700/70 text-rose-400 hover:bg-slate-700/60";
        } else {
          btnClass += "bg-slate-900/70 border-slate-700/70 text-slate-300 hover:bg-slate-700/60";
        }
        return `<button type="button" data-day="${d.id}" class="${btnClass}">
                  <div>${d.short}</div>
                  <div class="text-[10px] opacity-60 font-normal">(${d.id})</div>
                </button>`;
      }).join("");

      dayContainer.querySelectorAll("button[data-day]").forEach(btn => {
        btn.addEventListener("click", () => selectDay(Number(btn.dataset.day)));
      });

      const dailyView = document.getElementById("daily-view");
      const weeklyView = document.getElementById("weekly-view");
      const toggleBtn = document.getElementById("btn-toggle-weekly");

      if (isWeeklyOpen) {
        dailyView.classList.add("hidden");
        weeklyView.classList.remove("hidden");
        toggleBtn.textContent = "일일 상세 보기";
        renderWeeklyTable();
      } else {
        dailyView.classList.remove("hidden");
        weeklyView.classList.add("hidden");
        toggleBtn.textContent = "주간 전체표";
        renderDailyRoutine();
      }
    }

    function renderDailyRoutine() {
      const splitData = WORKOUT_DATA[currentSplit];
      const routine = splitData.days[currentDay];

      document.getElementById("badge-split").textContent = splitData.name;
      document.getElementById("badge-day").textContent = `${routine.dayName} (입력값: ${currentDay})`;
      document.getElementById("routine-title").textContent = routine.target;
      document.getElementById("raw-cpp-output").textContent = routine.raw;

      renderExercises();
    }

    function renderExercises() {
      const routine = WORKOUT_DATA[currentSplit].days[currentDay];
      const listEl = document.getElementById("exercise-list");

      listEl.innerHTML = routine.exercises.map((ex, idx) => {
        const done = completedSet.has(idx);
        return `
          <div data-ex-idx="${idx}"
            class="exercise-card cursor-pointer p-4 rounded-xl border flex items-start gap-3.5 ${
              done
                ? "bg-emerald-950/30 border-emerald-500/40"
                : "bg-slate-900/70 border-slate-700/70 hover:border-indigo-500/50"
            }">
            <div class="mt-0.5 w-6 h-6 rounded-lg flex items-center justify-center border flex-shrink-0 transition-colors ${
              done
                ? "bg-emerald-500 border-emerald-400 text-slate-950 font-bold"
                : "border-slate-600 text-transparent"
            }">
              ✓
            </div>
            <div class="flex-1">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                <h3 class="font-bold text-base ${done ? "line-through text-slate-400" : "text-white"}">
                  ${ex.name}
                </h3>
                <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${
                  done ? "bg-emerald-500/20 text-emerald-300" : "bg-slate-800 text-indigo-300 border border-slate-700"
                }">
                  ${ex.sets}
                </span>
              </div>
              <p class="text-xs sm:text-sm ${done ? "text-slate-500" : "text-slate-400"}">
                💡 ${ex.tip}
              </p>
            </div>
          </div>
        `;
      }).join("");

      listEl.querySelectorAll("[data-ex-idx]").forEach(card => {
        card.addEventListener("click", () => toggleExercise(Number(card.dataset.exIdx)));
      });

      const total = routine.exercises.length;
      const pct = total === 0 ? 0 : Math.round((completedSet.size / total) * 100);
      document.getElementById("progress-text").textContent = `${pct}% (${completedSet.size}/${total})`;
      document.getElementById("progress-bar").style.width = `${pct}%`;
    }

    function renderWeeklyTable() {
      const splitData = WORKOUT_DATA[currentSplit];
      document.getElementById("weekly-title").textContent = `${splitData.name} 주간 전체 스케줄`;
      const tbody = document.getElementById("weekly-table-body");

      tbody.innerHTML = DAY_ORDER.map(d => {
        const item = splitData.days[d.id];
        const isCurrent = d.id === currentDay;
        const exNames = item.exercises.map(e => e.name).join(", ");
        return `
          <tr class="${isCurrent ? "bg-indigo-500/10" : "hover:bg-slate-700/30"}">
            <td class="py-3 px-3 font-bold ${d.id === 0 ? "text-rose-400" : "text-white"}">${item.dayName}</td>
            <td class="py-3 px-3 font-semibold text-indigo-300">${item.target}</td>
            <td class="py-3 px-3 text-slate-300">${exNames}</td>
            <td class="py-3 px-3 text-right">
              <button type="button" data-select-day="${d.id}"
                class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-700 hover:bg-indigo-600 text-white transition-colors">
                보기
              </button>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll("button[data-select-day]").forEach(btn => {
        btn.addEventListener("click", () => selectDay(Number(btn.dataset.selectDay)));
      });
    }

    document.getElementById("btn-split-1").addEventListener("click", () => selectSplit(1));
    document.getElementById("btn-split-2").addEventListener("click", () => selectSplit(2));
    document.getElementById("btn-today").addEventListener("click", selectToday);
    document.getElementById("btn-toggle-weekly").addEventListener("click", toggleWeeklyView);
    document.getElementById("btn-back-daily").addEventListener("click", toggleWeeklyView);

    updateUI();
  </script>
</body>
</html>
